[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adversarial-engineering-arena"
version = "0.3.1"
description = "A local, auditable competition harness for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Arena contributors" }]
dependencies = []

[project.optional-dependencies]
api = [
  "openai>=1.66",
  "anthropic>=0.40",
]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
agent-arena = "agent_arena.cli:main"
team = "agent_arena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_arena"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_arena"]
